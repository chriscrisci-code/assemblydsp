    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

  <body>
    <header class="site-header is-scrolled">
      <a class="logo" href="/" aria-label="Assembly DSP">
        <img src="/images/assembly-dsp-mark.png" alt="" width="479" height="265" />
        <span>Assembly DSP</span>
      </a>
      <nav class="nav" aria-label="Primary">
        <a href="/#chunk">CHUNK</a>
        <a href="/#layers">Layers</a>
        <a href="/#compare">Compare</a>

      </nav>
      <a class="header-cta js-download-chunk" href="/#download">Download</a>

    <main class="support-page">
      <div class="support-inner">
        <p class="eyebrow">Support</p>
        <h1 class="success-title">CHUNK is free.</h1>
        <p class="section-lede">
          Download it, install the VST3, and open it in your DAW. No license key.
          Questions:
          <a href="mailto:support@assemblydsp.com">support@assemblydsp.com</a>.
        </p>
        <div class="cta-row">
          <a class="btn btn-primary js-download-chunk" href="/#download">Download CHUNK</a>
          <a class="btn btn-ghost" href="/">Back to Assembly DSP</a>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <p class="footer-fine">
        Assembly DSP
        <span id="chunk-build" class="footer-build" hidden></span>
      </p>
    </footer>

    <script type="module">
      import { applyBackground, loadSiteContent } from "./src/content.js";
      import { applyDownloadLinks, applyFooterBuild, loadCurrentBuild } from "./src/build-info.js";
      loadSiteContent().then((content) => applyBackground(content.theme?.background));
      loadCurrentBuild().then((build) => {
        applyDownloadLinks(build);
        applyFooterBuild(document.getElementById("chunk-build"), build);
      });
    </script>
