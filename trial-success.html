<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CHUNK is free — Assembly DSP</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="CHUNK is free. Download the Windows VST3." />
    <link rel="icon" href="/images/assembly-dsp-mark.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="site-header is-scrolled">
      <a class="logo" href="/" aria-label="Assembly DSP">
        <img src="/images/assembly-dsp-mark.png" alt="" width="479" height="265" />
        <span>Assembly DSP</span>
      </a>
      <a class="header-cta js-download-chunk" href="/#download">Download</a>
    </header>

    <main class="success-page">
      <div class="success-inner">
        <p class="eyebrow">CHUNK</p>
        <h1 class="success-title">CHUNK is free.</h1>
        <p class="section-lede">
          Download the Windows VST3 and open it in your DAW. No license key.
        </p>
        <div class="cta-row">
          <a class="btn btn-primary js-download-chunk" href="/#download">Download CHUNK</a>
          <a class="btn btn-ghost" href="/">Back to Assembly DSP</a>
        </div>
        <p class="download-hint" id="download-hint" hidden></p>
      </div>
    </main>

    <script type="module">
      import { applyBackground, loadSiteContent } from "./src/content.js";
      import { applyDownloadButton, applyDownloadLinks, loadCurrentBuild } from "./src/build-info.js";
      loadSiteContent().then((content) => applyBackground(content.theme?.background));
      const downloadBtn = document.querySelector(".js-download-chunk.btn");
      const downloadHint = document.getElementById("download-hint");
      loadCurrentBuild().then((build) => {
        applyDownloadLinks(build);
        applyDownloadButton(downloadBtn, downloadHint, build);
      });
    </script>
  </body>
</html>
