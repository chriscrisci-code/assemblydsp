<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Purchase complete — Assembly DSP</title>
    <meta
      name="description"
      content="Thanks for buying CHUNK from Assembly DSP. Your license key is below."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>

    <header class="site-header is-scrolled">
      <a class="logo" href="/">Assembly DSP</a>
      <a class="header-cta" href="/#pricing">Back to site</a>
    </header>

    <main class="success-page">
      <div class="success-inner">
        <p class="eyebrow">Checkout</p>
        <h1 class="success-title">You’re in.</h1>
        <p class="section-lede">
          Thanks for purchasing <strong>CHUNK</strong>. Stripe will email your receipt.
          Enter this license key in CHUNK to activate (up to 2 machines).
        </p>

        <div class="license-box" id="license-box">
          <p class="auth-label">Your license key</p>
          <p class="license-key" id="license-key">Loading…</p>
          <p class="success-session" id="license-status" role="status"></p>
          <button type="button" class="btn btn-ghost" id="copy-key" hidden>Copy key</button>
        </div>

        <p class="success-session" id="session-line" hidden></p>
        <div class="cta-row">
          <a class="btn btn-primary" href="/">Back to Assembly DSP</a>
          <a class="btn btn-ghost" href="/#layers">See the layers</a>
        </div>
      </div>
    </main>

    <script type="module">
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get("session_id");
      const line = document.getElementById("session-line");
      const keyEl = document.getElementById("license-key");
      const statusEl = document.getElementById("license-status");
      const copyBtn = document.getElementById("copy-key");

      if (sessionId && line) {
        line.hidden = false;
        line.textContent = `Order reference: ${sessionId}`;
      }

      async function loadLicense(attempt = 0) {
        if (!sessionId) {
          keyEl.textContent = "—";
          statusEl.textContent = "Missing checkout session.";
          return;
        }
        try {
          const response = await fetch(
            `/api/license/by-session?session_id=${encodeURIComponent(sessionId)}`,
          );
          const data = await response.json().catch(() => ({}));
          if (!response.ok || !data.licenseKey) {
            if (attempt < 8) {
              statusEl.textContent = "Preparing your key…";
              setTimeout(() => loadLicense(attempt + 1), 1500);
              return;
            }
            throw new Error(data.error || "Could not load license key.");
          }
          keyEl.textContent = data.licenseKey;
          statusEl.textContent = "Enter this key in CHUNK → License.";
          copyBtn.hidden = false;
          copyBtn.onclick = async () => {
            await navigator.clipboard.writeText(data.licenseKey);
            copyBtn.textContent = "Copied";
          };
        } catch (err) {
          keyEl.textContent = "—";
          statusEl.textContent =
            err instanceof Error ? err.message : "Could not load license key.";
        }
      }

      loadLicense();
    </script>
  </body>
</html>
